name = "workbench-push"
main = "cloudflare-worker.js"
compatibility_date = "2024-01-01"

# Cron Triggers: every minute checks due notifications
[triggers]
crons = ["* * * * *"]

# KV namespace for storing scheduled notifications
# Create with: wrangler kv:namespace create NOTIFICATIONS
# Then paste the id below
[[kv_namespaces]]
binding = "NOTIFICATIONS"
id = "b857192b7ea64586b24bac2bb3d2bf34"

